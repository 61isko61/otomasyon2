<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geri Bildirim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #EEF0F9;
    --bg-bottom: #E1E4F2;
    --card-bg: #FFFFFF;
    --title-color: #17223D;
    --subtitle-color: #6C7A94;
    --footer-color: #9AA3B5;
    --footer-strong: #5C6B82;
    --worst: #E5484D;
    --bad: #F2954B;
    --avg: #C6A020;
    --good: #3FAE5C;
    --great: #14A886;
    --blue: #3D74EE;
    --blue-dark: #2F62D6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100vh; }

  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 18px;
  }

  .page { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 22px; }

  .card {
    width: 100%;
    background: var(--card-bg);
    border-radius: 30px;
    box-shadow: 0 30px 60px -20px rgba(23, 34, 61, 0.18), 0 10px 25px -12px rgba(23, 34, 61, 0.08);
    padding: 46px 26px 34px;
    text-align: center;
    animation: riseIn 0.6s cubic-bezier(.22,1,.36,1) both;
  }

  .card-content { transition: opacity 0.25s ease, transform 0.25s ease; min-height: 60px; }
  .card-content.fade-out { opacity: 0; transform: translateY(6px); }

  h1 { margin: 0 0 18px; font-size: clamp(26px, 7.5vw, 32px); font-weight: 900; color: var(--title-color); letter-spacing: -0.01em; }
  .subtitle { margin: 0 0 36px; color: var(--subtitle-color); font-size: 15.5px; line-height: 1.6; font-weight: 700; }

  /* --- Rating row --- */
  .emoji-row { display: flex; justify-content: space-between; gap: 4px; }

  .emoji-btn {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 6px 2px; flex: 1; border-radius: 16px;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s ease;
  }

  .emoji-btn:hover { transform: translateY(-4px); }
  .emoji-btn:focus-visible { outline: 2px solid var(--subtitle-color); outline-offset: 3px; }
  .emoji-btn.selected { transform: scale(1.18); }
  .emoji-btn.dimmed { opacity: 0.28; transform: scale(0.9); }

  .emoji-circle {
    width: 50px; height: 50px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 29px; line-height: 1; background: transparent;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .emoji-btn.selected .emoji-circle { box-shadow: 0 10px 22px -6px var(--glow, rgba(0,0,0,0.25)); }
  .label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.02em; }

  .worst .label { color: var(--worst); }
  .bad .label { color: var(--bad); }
  .avg .label { color: var(--avg); }
  .good .label { color: var(--good); }
  .great .label { color: var(--great); }

  .worst.selected .emoji-circle { background: rgba(229,72,77,0.12); --glow: rgba(229,72,77,0.4); }
  .bad.selected .emoji-circle   { background: rgba(242,149,75,0.14); --glow: rgba(242,149,75,0.4); }
  .avg.selected .emoji-circle   { background: rgba(198,160,32,0.14); --glow: rgba(198,160,32,0.4); }
  .good.selected .emoji-circle  { background: rgba(63,174,92,0.14); --glow: rgba(63,174,92,0.4); }
  .great.selected .emoji-circle { background: rgba(20,168,134,0.14); --glow: rgba(20,168,134,0.4); }

  /* --- Generic centered status screen (thank you / not found) --- */
  .status-block { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; gap: 14px; }

  .check-icon {
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(20,168,134,0.12); color: var(--great);
    font-size: 26px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }

  .status-block h2 { margin: 0; color: var(--title-color); font-size: 21px; font-weight: 900; }
  .status-block p { margin: 0; color: var(--subtitle-color); font-size: 15px; font-weight: 700; max-width: 260px; line-height: 1.55; }

  /* --- Negative path screen --- */
  .sorry-block { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px; }
  .sorry-emoji { font-size: 44px; margin-bottom: 8px; }
  .sorry-title { margin: 0 0 14px; font-size: 21px; font-weight: 900; color: var(--title-color); }
  .sorry-text { margin: 0 0 26px; font-size: 15px; line-height: 1.65; color: var(--subtitle-color); font-weight: 600; max-width: 320px; }
  .sorry-text strong { color: var(--title-color); font-weight: 800; }

  .manager-btn {
    width: 100%; background: linear-gradient(180deg, var(--blue), var(--blue-dark)); color: #fff;
    border: none; border-radius: 16px; padding: 16px 18px; font-size: 14px; font-weight: 800;
    letter-spacing: 0.01em; line-height: 1.35;
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    box-shadow: 0 14px 26px -10px rgba(61,116,238,0.55);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .manager-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 30px -10px rgba(61,116,238,0.6); }
  .manager-btn svg { flex-shrink: 0; }

  .google-link {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 18px;
    color: var(--footer-color); font-size: 12.5px; font-weight: 700; text-decoration: none;
  }
  .google-link:hover { color: var(--footer-strong); }
  .google-link svg { flex-shrink: 0; }

  /* --- Manager feedback form --- */
  .feedback-form { display: flex; flex-direction: column; align-items: stretch; gap: 18px; margin-top: 4px; }

  .feedback-textarea {
    width: 100%; min-height: 150px; resize: vertical;
    border: 1.5px solid #CFE0FB; border-radius: 18px; padding: 16px 18px;
    font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; font-weight: 600;
    color: var(--title-color); background: #fff; outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .feedback-textarea::placeholder { color: #9AA9C2; font-weight: 600; }
  .feedback-textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(61,116,238,0.12); }

  .send-btn {
    width: 100%; background: linear-gradient(180deg, var(--blue), var(--blue-dark)); color: #fff;
    border: none; border-radius: 16px; padding: 16px 18px; font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    box-shadow: 0 14px 26px -10px rgba(61,116,238,0.55);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .send-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 30px -10px rgba(61,116,238,0.6); }
  .send-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .send-btn svg { flex-shrink: 0; }

  /* --- Footer --- */
  .footer-text {
    color: var(--footer-color); font-size: 12.5px; font-weight: 700; text-align: center; padding: 0 24px;
    animation: riseIn 0.6s cubic-bezier(.22,1,.36,1) 0.1s both;
  }
  .footer-text strong { color: var(--footer-strong); font-weight: 900; }

  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .card, .footer-text, .emoji-btn, .card-content { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="card-content" id="cardContent"></div>
    </div>
    <p class="footer-text">Bu işletme <strong>GooUzman</strong> kalite standartları ile analiz edilmektedir.</p>
  </div>

<script>
  /* ============================================================
     İŞLETME LİSTESİ — Yeni bir işletme eklemek için buraya aynı
     formatta bir satır daha ekleyin. "slug" kısmı linkte
     ?isletme=... olarak kullanılacak (Türkçe karakter, boşluk
     kullanmayın: kucuk-harf-ve-tire seklinde yazin).

     telegramChatId: Olumsuz geri bildirimlerin hangi Telegram
     sohbetine düşeceğini belirler. Nasıl bulunacağı için Claude'a
     sorulan "Telegram bağlantısı" adımlarına bakın.
     ============================================================ */
  const TELEGRAM_BOT_TOKEN = "BURAYA_BOTFATHER_TOKEN_YAZIN";

  const BUSINESSES = {
    // Buraya her gerçek işletme için bir satır ekleyin, örnek:
    // "corba-konagi": { name: "Çorba Konağı", googleReviewUrl: "https://g.page/r/.../review", telegramChatId: "123456789" },
    "corba-konagi": { name: "Çorba Konağı", googleReviewUrl: "https://search.google.com/local/writereview?placeid=ChIJd4E1N1q6yhQRmNcMKGnuXiM", telegramChatId: "" },
  };

  const SUBTITLE = "Sizlere daha iyi bir hizmet sunabilmemiz için geri bildirimleriniz bizim için çok değerlidir. Lütfen deneyiminizi paylaşın.";

  const slug = new URLSearchParams(window.location.search).get('isletme');
  const business = BUSINESSES[slug];

  const cardContent = document.getElementById('cardContent');
  let locked = false;

  const personIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"></path></svg>`;
  const externalIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;
  const sendIcon = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;

  function swapContent(html, after) {
    cardContent.classList.add('fade-out');
    setTimeout(() => {
      cardContent.innerHTML = html;
      cardContent.classList.remove('fade-out');
      if (after) after();
    }, 250);
  }

  function renderRating() {
    document.title = business.name + " — Geri Bildirim";
    cardContent.innerHTML = `
      <h1>${business.name}</h1>
      <p class="subtitle">${SUBTITLE}</p>
      <div class="emoji-row">
        <button class="emoji-btn worst" data-rating="1" aria-label="Çok kötü">
          <span class="emoji-circle">😠</span><span class="label">ÇOK KÖTÜ</span>
        </button>
        <button class="emoji-btn bad" data-rating="2" aria-label="Kötü">
          <span class="emoji-circle">😐</span><span class="label">KÖTÜ</span>
        </button>
        <button class="emoji-btn avg" data-rating="3" aria-label="Ortalama">
          <span class="emoji-circle">🙂</span><span class="label">ORTALAMA</span>
        </button>
        <button class="emoji-btn good" data-rating="4" aria-label="İyi">
          <span class="emoji-circle">😊</span><span class="label">İYİ</span>
        </button>
        <button class="emoji-btn great" data-rating="5" aria-label="Harika">
          <span class="emoji-circle">🤩</span><span class="label">HARİKA</span>
        </button>
      </div>
    `;
    const buttons = cardContent.querySelectorAll('.emoji-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (locked) return;
        locked = true;
        const rating = parseInt(btn.dataset.rating, 10);
        buttons.forEach(b => b.classList.add(b === btn ? 'selected' : 'dimmed'));
        setTimeout(() => {
          if (rating <= 3) {
            renderNegative();
          } else {
            window.location.href = business.googleReviewUrl;
          }
        }, 550);
      });
    });
  }

  function renderNegative() {
    swapContent(`
      <h1>${business.name}</h1>
      <p class="subtitle">${SUBTITLE}</p>
      <div class="sorry-block">
        <div class="sorry-emoji">😔</div>
        <h2 class="sorry-title">Sizi üzmek istemezdik...</h2>
        <p class="sorry-text">Amacımız her zaman %100 memnuniyet. Yaşadığınız bu aksaklığı <strong>hemen telafi edebilmemiz için</strong> sorunu doğrudan işletme yöneticisine iletebilirsiniz. Seçim sizin:</p>
        <button class="manager-btn" id="managerBtn">${personIcon}<span>YÖNETİCİYE İLET (TELAFİ EDELİM)</span></button>
        <a class="google-link" href="${business.googleReviewUrl}">${externalIcon}Hayır, deneyimimi Google'da paylaşacağım</a>
      </div>
    `, () => {
      document.getElementById('managerBtn').addEventListener('click', renderManagerForm);
    });
  }

  function renderManagerForm() {
    swapContent(`
      <h1>${business.name}</h1>
      <p class="subtitle">${SUBTITLE}</p>
      <div class="feedback-form">
        <textarea class="feedback-textarea" id="feedbackText" placeholder="Yaşadığınız sorunu kısaca açıklayınız..."></textarea>
        <button class="send-btn" id="sendBtn" disabled><span>Geri Bildirimi Gönder</span>${sendIcon}</button>
      </div>
    `, () => {
      const textarea = document.getElementById('feedbackText');
      const sendBtn = document.getElementById('sendBtn');

      textarea.addEventListener('input', () => {
        sendBtn.disabled = textarea.value.trim().length === 0;
      });

      sendBtn.addEventListener('click', async () => {
        const message = textarea.value.trim();
        if (!message) return;

        sendBtn.disabled = true;
        sendBtn.querySelector('span').textContent = 'Gönderiliyor...';

        const text = `📩 Yeni geri bildirim — ${business.name}\n\n${message}`;

        try {
          if (business.telegramChatId && TELEGRAM_BOT_TOKEN && !TELEGRAM_BOT_TOKEN.startsWith('BURAYA')) {
            const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: business.telegramChatId, text })
            });
            if (!res.ok) throw new Error('Telegram gönderimi başarısız');
          }
          renderManagerConfirmation();
        } catch (err) {
          sendBtn.disabled = false;
          sendBtn.querySelector('span').textContent = 'Geri Bildirimi Gönder';
          alert('Gönderilemedi, lütfen tekrar deneyin.');
        }
      });
    });
  }

  function renderManagerConfirmation() {
    swapContent(`
      <div class="status-block">
        <div class="check-icon" style="background: rgba(61,116,238,0.12); color: var(--blue);">&#10003;</div>
        <h2>İletildi!</h2>
        <p>Talebiniz işletme yöneticisine ulaştı. En kısa sürede sizinle iletişime geçilecek.</p>
      </div>
    `);
  }

  function renderNotFound() {
    document.title = "Geri Bildirim";
    cardContent.innerHTML = `
      <div class="status-block">
        <div class="check-icon" style="background: rgba(229,72,77,0.12); color: var(--worst);">!</div>
        <h2>İşletme bulunamadı</h2>
        <p>Bu bağlantı geçerli değil. Lütfen size verilen doğru geri bildirim linkini kullanın.</p>
      </div>
    `;
  }

  if (business) {
    renderRating();
  } else {
    renderNotFound();
  }
</script>
</body>
</html>
